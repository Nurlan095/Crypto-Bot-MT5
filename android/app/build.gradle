plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nurik.cryptobot'
    compileSdk 35

    defaultConfig {
        applicationId "com.nurik.cryptobot"
        minSdk 24
        targetSdk 35
        versionCode 267
        versionName "2.67"
    }

    signingConfigs {
        releaseKey {
            storeFile file("../release-key.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.releaseKey
        }
        debug {
            signingConfig signingConfigs.releaseKey
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
